name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Monthly, to catch breakage from new Ruby or RSpec releases
  # when nothing has been pushed.
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}, RSpec ${{ matrix.rspec || 'latest' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: '2.7' }
          - { ruby: '3.0' }
          - { ruby: '3.1' }
          - { ruby: '3.2' }
          - { ruby: '3.3' }
          - { ruby: '3.4' }
          - { ruby: '4.0' }
          # The oldest RSpec supported.
          - { ruby: '2.7', rspec: '~> 3.0.0' }
    env:
      RSPEC_VERSION: ${{ matrix.rspec }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Demos
        run: bundle exec qed -Ilib demo/
